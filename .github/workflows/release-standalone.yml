name: release-standalone

# 头像处理使用 sharp 原生模块，产物按 Linux glibc CPU 架构构建。
# Alpine / musl 使用 Docker 镜像；其他平台从源码构建。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动触发时：把产物附加到哪个已存在的 Release tag（如 v2.20.2）；留空则只产出 artifact'
        required: false
        type: string

permissions:
  contents: write # 创建 Release 并上传资产

jobs:
  package:
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      # 拉全量历史与 tag：发版说明要算上一版（git describe）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # next.config.ts 只在 DOCKER_BUILD=1 时启用 output: 'standalone'
      - name: 构建 standalone 产物
        env:
          DOCKER_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: 组装运行包目录
        working-directory: .next/standalone
        run: |
          # standalone 只含 server.js 与按需 trace 的 node_modules，
          # 静态资源与 public 需按 Dockerfile 的方式补进来
          cp -r ../../public ./public
          cp ../../LICENSE ./LICENSE
          mkdir -p ./.next
          cp -r ../static ./.next/static

          cp ../../package.json ./package.json
          mkdir -p scripts src/server node_modules/server-only
          cp ../../scripts/create-admin.ts ./scripts/
          cp ../../src/server/{database,identity}.ts ./src/server/
          cp -r ../../node_modules/server-only/. ./node_modules/server-only/

          # next build 会把项目根的 .env* 一并复制进 standalone（本地实测会带 PASSWORD）。
          # 发布包是公开下载的，绝不能带任何环境文件；删完再兜底校验
          rm -f .env .env.*
          if find . -maxdepth 1 -name '.env*' | grep -q .; then
            echo '::error::产物里仍有 .env 文件，拒绝发布'
            find . -maxdepth 1 -name '.env*'
            exit 1
          fi

          node -e "require('sharp'); require('node:sqlite')"

      - name: 冒烟测试
        working-directory: .next/standalone
        run: |
          # 必须重定向输出：后台进程占着 stdout 会让这一步一直挂着不结束
          SQLITE_PATH=/tmp/putv-standalone-smoke.sqlite PORT=3000 HOSTNAME=127.0.0.1 node server.js > /tmp/standalone.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS http://127.0.0.1:3000/api/status > /dev/null; then
              echo "启动正常（${i}s）"
              kill "$SERVER_PID"
              exit 0
            fi
          done
          echo '::error::standalone 包启动失败，不发布'
          cat /tmp/standalone.log
          kill "$SERVER_PID" 2> /dev/null || true
          exit 1

      - name: 打包
        run: |
          VER="$(node -p "require('./package.json').version")"
          mkdir -p dist
          tar -czf "dist/putv-${VER}-linux-${{ matrix.arch }}.tar.gz" -C .next/standalone .
          (cd dist && sha256sum putv-*.tar.gz > SHA256SUMS-linux-${{ matrix.arch }})
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.arch }}-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      # tag 触发直接挂到该 tag 的 Release；手动触发则在填了 tag 输入时才挂，
      # 留空只出 artifact（方便先试跑打包链路，不碰任何 Release）
      - name: 生成发布说明
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$TAG_INPUT"
          fi
          if [ -z "$TAG" ]; then
            echo '::error::手动触发需要填写 tag 输入'; exit 1
          fi
          # 只认已存在的 tag：避免 gh 顺手按默认分支新建一个指错提交的 tag
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::远端没有 tag ${TAG}，请先推送 tag 或检查输入"; exit 1
          fi

          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${VER}" ]; then
            echo "::warning::tag ${TAG} 与 package.json 的 ${VER} 不一致，文件仍按 ${VER} 命名"
          fi

          # 镜像名与 docker-publish 保持一致：GHCR 按仓库全名转小写
          GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2> /dev/null || true)"
          # 写到 RUNNER_TEMP，不落在工作区（避免本地复现时在仓库里留文件）
          NOTES="${RUNNER_TEMP}/release-notes.md"

          {
            echo '## 获取方式'
            echo
            echo '### Docker（多架构 linux/amd64 / linux/arm64）'
            echo
            echo '```bash'
            echo "docker pull ${GHCR}:${VER}"
            echo '```'
            echo
            echo "镜像发布在本仓库的 GHCR，请按版本号选择。"
            echo
            echo '### 免 Docker（下方 Linux glibc 附件，Node 22.13+）'
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS-linux-${{ matrix.arch }}"
            echo "mkdir -p putv"
            echo "tar -xzf putv-${VER}-linux-${{ matrix.arch }}.tar.gz -C putv"
            echo "cd putv && PASSWORD=your-invite APP_ORIGIN=https://putv.example.com PORT=8080 node server.js"
            echo '```'
            echo
            echo '按设备选择 x64 或 arm64 包；需要持久化 data 目录。环境变量与 Docker 部署一致，管理员在服务器内运行 npm run admin:create。'
            echo
            echo '> 镜像由 docker-publish 工作流在同一 tag 上构建，刚发布时可能还要 5–10 分钟才可拉取。'
            echo
            echo '## 变更'
            echo
            if [ -n "$PREV" ]; then
              echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "完整提交：https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > "$NOTES"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"
          cat "$NOTES"

      - name: 创建 Release 并上传资产
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 已存在的 Release 只补资产、不覆盖说明（说明可能是人工改过的）
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，只更新附件，说明保持不变"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" || gh release view "$TAG" > /dev/null
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS-* --clobber
